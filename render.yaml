# Hospedagem única da CEME: loja + API + Postgres no Render.
# Dashboard → Blueprints → New Blueprint Instance → este repositório → Apply.
# Isso cria o web service (ceme-checkout), o banco ceme-orders e um disco de backup.
# Sem o Postgres o processo NÃO sobe (REQUIRE_POSTGRES=true). Não use Supabase.

databases:
  - name: ceme-orders
    plan: basic-256mb
    databaseName: ceme
    user: ceme
    ipAllowList: []

services:
  - type: web
    name: ceme-checkout
    runtime: node
    plan: starter
    rootDir: server
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: ceme-orders-disk
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ceme-orders
          property: connectionString
      - key: REQUIRE_POSTGRES
        value: "true"
      - key: DEMO_PAYMENTS
        value: "false"
      - key: MP_TEST_MODE
        value: "false"
      - key: FREE_SHIPPING_FROM
        value: "360"
      # Cole as chaves APP_USR- da conta Mercado Pago do cliente só no painel.
      # Sem elas a loja sobe em modo demo (não cobra). Não cole token no GitHub.
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      # Vazio = a loja e a API são o mesmo endereço do Render (mesmo origin).
      # Só preencha se o HTML ficar no GitHub Pages ou num domínio à parte.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: STORE_ALERT_PHONE
        sync: false
