# Único serviço de hospedagem da CEME: Render.
# Blueprints → Apply neste repositório cria o Postgres e o disco.
# Sem isso, pedido, rastreio e gráfico somem no restart. Não use Supabase.

databases:
  - name: ceme-orders
    plan: basic-256mb
    databaseName: ceme
    user: ceme
    ipAllowList: []

services:
  - type: web
    name: ceme-checkout
    runtime: node
    plan: starter
    # Static files (index/checkout/pedidos) ficam na raiz do repo; mudança só no front
    # pode não republicar se o Render filtrar por rootDir — toque server/ ao publicar front.
    # Front (index/checkout) fica na raiz; toque server/ ao publicar só front.
    rootDir: server
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: ceme-orders-disk
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ceme-orders
          property: connectionString
      - key: DEMO_PAYMENTS
        value: "false"
      - key: MP_TEST_MODE
        value: "false"
      - key: FREE_SHIPPING_FROM
        value: "360"
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: STORE_ALERT_PHONE
        sync: false
